services:
  izrael:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Set in .env next to this file. MUST NOT be committed.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_APP_URL: ${TELEGRAM_APP_URL:-}
    volumes:
      - scores:/data

volumes:
  scores:
